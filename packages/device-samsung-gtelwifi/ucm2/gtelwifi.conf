Syntax 4

# Samsung Galaxy Tab E 9.6 (SM-T560, gtelwifi): SC7730 VBC + SC2723 codec,
# simple-audio-card "gtelwifi". Only the internal mono speaker for now.

SectionUseCase."HiFi" {
	File "/Unisoc/SC7730/gtelwifi/HiFi.conf"
	Comment "Play HiFi quality music"
}

FixedBootSequence [
	# both DACs are mixed into the mono speaker PA (AOL)
	cset "name='SPKL Mixer DACL Switch' on"
	cset "name='SPKL Mixer DACR Switch' on"
]

BootSequence [
	# DAC 0 dB, speaker +6 dB as the vendor HAL; more clips on VBAT
	cset "name='DAC Playback Volume' 7,7"
	cset "name='Speaker Playback Volume' 10"
]
