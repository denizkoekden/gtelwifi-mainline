<?xml version="1.0" standalone="yes"?>
<!--
Mesa's kmsro list knows neither simpledrm nor sprd-dispc (the SC7730 display
controllers), so EGL on card0 would fall back to software rendering. Map both
to a kmsro driver; it then renders on lima's render node (Mali-400 MP2).
Remove once sprd-dispc is in Mesa's kmsro list.
-->
<driconf>
    <device driver="loader" kernel_driver="simpledrm">
        <application name="Default">
            <option name="dri_driver" value="sun4i-drm" />
        </application>
    </device>
    <device driver="loader" kernel_driver="sprd-dispc">
        <application name="Default">
            <option name="dri_driver" value="sun4i-drm" />
        </application>
    </device>
</driconf>
