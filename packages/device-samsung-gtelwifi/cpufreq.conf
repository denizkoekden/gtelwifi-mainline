# CPU frequency limit in kHz, read at boot by samsung-gtelwifi-cpufreq-limit.
# 1300000 is the vendor maximum. Higher values enable overclocking steps
# (1352000 1404000 1456000 1508000 1560000 1612000), tested on one unit
# only: use at your own risk. Above 85 C the kernel throttles anyway.
#CPU_MAX_KHZ=1300000
