# Samsung Galaxy Tab E 9.6 (gtelwifi): settings of the mainline sensors HAL
# (hardware/mainline/common, interfaces/sensors/mainline/README.md)

backends = iio

[iio.lis2hh12]
# Android axes (X right, Y up, Z out of the screen, +1 g up when lying
# face up): X = -Y_chip, Y = X_chip, Z = -Z_chip, the vendor's map. The DT
# mount-matrix (patch 0050) follows iio-sensor-proxy, whose readings point
# along gravity, and is this turned by 180 degrees; under Android it put
# the screen upside down in every orientation.
mount_matrix = 0, -1, 0; 1, 0, 0; 0, 0, -1
