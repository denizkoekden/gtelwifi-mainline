Syntax 4

# Samsung Galaxy Tab E 9.6 (SM-T560, gtelwifi): SC7730 VBC + SC2723 codec,
# simple-audio-card "gtelwifi": mono speaker, headphone jack (GPIO 237),
# internal microphone.
#
# Copy of the Nura device package's UCM (nura/device-samsung-gtelwifi/ucm2),
# only the ADC boot value differs. Installed as
# /vendor/etc/alsa/ucm2/Unisoc/SC7730/gtelwifi/ (device.mk), the mainline
# audio HAL runs FixedBootSequence and BootSequence at start-up.

SectionUseCase."HiFi" {
	File "/Unisoc/SC7730/gtelwifi/HiFi.conf"
	Comment "Play HiFi quality music"
}

FixedBootSequence [
	# both DACs are mixed into the mono speaker PA (AOL)
	cset "name='SPKL Mixer DACL Switch' on"
	cset "name='SPKL Mixer DACR Switch' on"
	cset "name='HPL Mixer DACL Switch' on"
	cset "name='HPR Mixer DACR Switch' on"
	cset "name='ADCL Mixer MIC Switch' on"
	cset "name='ADCR Mixer MIC Switch' on"
	# fixed gains, not exposed to PipeWire: headphones -12 dB as the
	# vendor HAL, mic boost at maximum (the ADC volume below is the
	# capture volume)
	cset "name='Headphone Playback Volume' 8,8"
	cset "name='Mic Boost Volume' 3"
	# VBC digital gain +9.75 dB (37 = 24 + 13 steps of 0.75 dB): the
	# built-in mic stays quiet with the analog path at maximum
	# (speech at 30-40 cm around -30 to -40 dBFS RMS, peaks -14 dBFS)
	cset "name='ADC Digital Capture Volume' 37,37"
]

BootSequence [
	# DAC 0 dB; speaker +18 dB (vendor HAL: +6 dB at DAC 5). Listening
	# test 07.11.: 15 (+21 dB) distorts slightly at full volume, 14 is
	# clean one step below; keeps headroom as VBAT drops
	cset "name='DAC Playback Volume' 7,7"
	cset "name='Speaker Playback Volume' 14"
	# ADC at maximum: the mainline audio HAL keeps capture volume in
	# software, so this stays (under Nura PipeWire sets the same 63 as
	# 100 % of the mic source)
	cset "name='ADC Capture Volume' 63,63"
]
